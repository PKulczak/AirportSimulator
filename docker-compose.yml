x-backend-env: &backend-env
  SECRET_KEY: django-insecure-docker-compose-dev-only
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_NAME: airportdb
  DATABASE_USER: postgres
  DATABASE_PASSWORD: postgres
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  LOG_LEVEL: INFO
  QUEUE_BROKER: dramatiq.brokers.redis.RedisBroker
  QUEUE_URL: redis://redis:6379/0
  CHANNEL_LAYER_URL: redis://redis:6379/0
  AIRCRAFT_SPEED_IN_KNOTS: "140"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airportdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airportdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations, then exits. web/worker wait for it to
  # succeed rather than each racing to migrate on startup.
  migrate:
    build: ./backend
    command: python manage.py migrate --noinput
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: python manage.py rundramatiq
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
